name: 'Docker Build and Deploy to AWS'

on:
  push:
    branches:
      - dev
      - c4t
  pull_request:
    branches:
      - dev
      - c4t

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: chain4travel-prod-ecr-camino-suite-20
  ECS_CLUSTER: chain4travel-prod
  ECS_SERVICE: suite-2-dev

jobs:
  docker:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare Docker tag
        id: setDefaults
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/c4t" ]] || [[ "${{ github.base_ref }}" == "c4t" ]]; then
              echo "tag=c4t" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.base_ref }}" == "dev" ]]; then
              echo "tag=dev" >> $GITHUB_OUTPUT
          else
              echo "tag=temp" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: ${{ (github.event_name == 'push') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ (github.event_name == 'push') }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build . -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.setDefaults.outputs.tag }}

      - name: Push to ECR and Deploy to ECS
        if: ${{ (github.event_name == 'push') }}
        run: |
          # Push image to ECR
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.setDefaults.outputs.tag }}
          
          # Force new deployment of ECS service
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Deployment triggered for ECS service: ${{ env.ECS_SERVICE }}"

  deploy-storybook:
    name: Deploy Storybook to S3
    if: ${{ (github.event_name == 'push') }}
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare S3 Bucket Name
        id: setDefaults
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/c4t" ]] || [[ "${{ github.base_ref }}" == "c4t" ]]; then
              echo "bucket=camino-suite-2-storybook-c4t-bucket" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.base_ref }}" == "dev" ]]; then
              echo "bucket=camino-suite-2-storybook-dev-bucket" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install yarn dependencies
        run: yarn install

      - name: Build storybook
        run: yarn build:storybook

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync libs/ui/storybook-static s3://${{ steps.setDefaults.outputs.bucket }} --delete
          echo "✅ Storybook deployed to S3 bucket: ${{ steps.setDefaults.outputs.bucket }}"

      - name: Invalidate CloudFront Cache
        run: |
          # Get CloudFront distribution ID for the bucket
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${{ steps.setDefaults.outputs.bucket }}.s3.${{ env.AWS_REGION }}.amazonaws.com']].Id" \
            --output text)
          
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
            echo "✅ CloudFront cache invalidated for distribution: $DISTRIBUTION_ID"
          else
            echo "⚠️  No CloudFront distribution found for bucket: ${{ steps.setDefaults.outputs.bucket }}"
          fi
